name: CI/CD Azure (SaaS)

# Construit, teste, publie les images et déploie sur Azure Container Apps.
# Authentification Azure par OIDC (federated credentials) — aucun secret de mot de passe.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ACR_NAME: ${{ vars.ACR_NAME }}                 # ex. contratacr
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  BACKEND_APP: ${{ vars.BACKEND_CONTAINERAPP }}  # ex. contrat-backend
  FRONTEND_APP: ${{ vars.FRONTEND_CONTAINERAPP }}
  IMAGE_TAG: ${{ github.sha }}

permissions:
  id-token: write   # requis pour l'OIDC azure/login
  contents: read

jobs:
  # 1) Qualité : tests backend (JaCoCo ≥ 90%) + build frontend
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Tests backend + couverture
        working-directory: backend
        run: mvn -B verify

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # 2) Images : build & push vers Azure Container Registry
  images:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connexion Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Connexion ACR
        run: az acr login --name "$ACR_NAME"

      - name: Build & push backend
        run: |
          docker build -t "$ACR_NAME.azurecr.io/contrat-backend:$IMAGE_TAG" ./backend
          docker push "$ACR_NAME.azurecr.io/contrat-backend:$IMAGE_TAG"

      - name: Build & push frontend
        run: |
          docker build -t "$ACR_NAME.azurecr.io/contrat-frontend:$IMAGE_TAG" ./frontend
          docker push "$ACR_NAME.azurecr.io/contrat-frontend:$IMAGE_TAG"

  # 3) Déploiement : mise à jour des Container Apps (profil prod → PostgreSQL, secrets Key Vault)
  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Connexion Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Déployer le backend
        run: |
          az containerapp update \
            --name "$BACKEND_APP" --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/contrat-backend:$IMAGE_TAG"

      - name: Déployer le frontend
        run: |
          az containerapp update \
            --name "$FRONTEND_APP" --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/contrat-frontend:$IMAGE_TAG"
