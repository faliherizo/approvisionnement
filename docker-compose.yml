services:

  # --- Assistance IA locale (Ollama) : modèle hébergé sur place, conforme Loi 25 ---
  ollama:
    image: ollama/ollama:latest
    container_name: vina-ia
    ports:
      - "${VINA_OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  # --- Base de données PostgreSQL (production) ---
  db:
    image: postgres:15
    container_name: contrat-db
    environment:
      POSTGRES_DB: contrat
      POSTGRES_USER: contrat
      POSTGRES_PASSWORD: ${DB_PASSWORD:?lancer scripts/generer-secrets.sh une fois (crée .env)}
    ports:
      # Port hôte 5433 (5432 occupé par une autre pile locale). Le backend joint la base via le
      # réseau interne « db:5432 » : ce mapping ne sert qu'aux outils DB externes.
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    restart: unless-stopped

  # --- Conversion Word → PDF/A (LibreOffice isolé du serveur, API Gotenberg ; addenda 4, Q22 ; ADR-018) ---
  conversion:
    image: gotenberg/gotenberg:8.17.3
    container_name: contrat-conversion
    # Délai de l'API aligné sur celui du serveur (CLM_CONVERSION_DELAI_SECONDES, 120 s) : à 30 s par défaut, Gotenberg
    # répond 503 à une conversion longue sous charge, alors que le serveur l'attendait encore.
    command: ["gotenberg", "--api-timeout=120s"]
    # Racine en lecture seule, sans capacité : LibreOffice n'écrit que dans des volumes temporaires.
    read_only: true
    tmpfs:
      - /tmp:uid=1001,gid=1001,exec
      - /home/gotenberg:uid=1001,gid=1001
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # --- Backend Java (Spring Boot, profil prod → PostgreSQL, schéma Liquibase) ---
  backend:
    build: ./backend
    container_name: contrat-backend
    depends_on:
      - ollama
      - db
      - conversion
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-8082}
      DB_URL: jdbc:postgresql://db:5432/contrat
      DB_USER: contrat
      DB_PASSWORD: ${DB_PASSWORD:?lancer scripts/generer-secrets.sh une fois (crée .env)}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      # Secrets propres à chaque installation (scripts/generer-secrets.sh) : le profil prod refuse de démarrer avec les
      # valeurs par défaut des fichiers de configuration (ExigencesProduction).
      JWT_SECRET: ${JWT_SECRET:?lancer scripts/generer-secrets.sh une fois (crée .env)}
      APP_CRYPTO_KEY: ${APP_CRYPTO_KEY:?lancer scripts/generer-secrets.sh une fois (crée .env)}
      APP_CRYPTO_SALT: ${APP_CRYPTO_SALT:?lancer scripts/generer-secrets.sh une fois (crée .env)}
      # Démonstration servie en HTTP sur le poste : le cookie ne peut pas être « Secure ». Une installation réelle est
      # servie en HTTPS et laisse ces deux valeurs par défaut (cookie Secure, aucune dérogation).
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_HTTP_LOCAL_AUTORISE: ${APP_HTTP_LOCAL_AUTORISE:-true}
      # Environnement de démonstration : crée le tenant IQ et un compte par profil (data/tenants-demo.json), que le
      # profil prod n'amorce pas seul. Une vraie production lance le compose avec APP_TENANTS_DEMO=false.
      APP_TENANTS_DEMO: ${APP_TENANTS_DEMO:-true}
      CLM_CONVERSION_MODE: service
      CLM_CONVERSION_URL: http://conversion:3000
      # Attestation de signature CAdES par le cachet X.509 (ST-09 ; ADR-019) : magasin et autorité d'horodatage par
      # CLM_CACHET_MAGASIN, CLM_CACHET_MOT_DE_PASSE et CLM_CACHET_TSA_URL (secrets hors dépôt).
      CLM_SIGNATURE_FOURNISSEUR: cachet
      # Courriel : « smtp » avec MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD du relais de l'organisation.
      NOTIFICATION_COURRIEL_MODE: ${NOTIFICATION_COURRIEL_MODE:-simulation}
    ports:
      - "8080:8085"
    restart: unless-stopped

  # --- Frontend React (build Vite servi par Nginx, proxy /api → backend) ---
  frontend:
    build: ./frontend
    container_name: contrat-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8082}:8080"
    restart: unless-stopped

volumes:
  ollama:
  dbdata:
