# Profil production : PostgreSQL (hébergement Canada), schéma géré par Liquibase.
# Activation : --spring.profiles.active=prod
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/contrat}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:contrat}
    password: ${DB_PASSWORD:contrat}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  h2:
    console:
      enabled: false

# Aucune organisation ni aucun compte de démonstration en production (activable pour un environnement de démonstration).
app:
  amorcage:
    tenants-demo: ${APP_TENANTS_DEMO:false}
  # Cookie de session réservé à HTTPS en production.
  cookie:
    secure: ${COOKIE_SECURE:true}
  # Dérogation au seul cookie « Secure », pour une démonstration servie en HTTP sur un poste ; jamais en production réelle.
  securite:
    http-local-autorise: ${APP_HTTP_LOCAL_AUTORISE:false}
    # Aucune adresse interne joignable par les appels sortants vers les fournisseurs des organisations (anti-SSRF).
    sortant:
      autorises: ${APP_SORTANT_AUTORISES:}

# Documentation de l'API fermée en production (inventaire de la surface d'attaque) ; ouvrable pour une recette.
springdoc:
  api-docs:
    enabled: ${APP_API_DOCS:false}
  swagger-ui:
    enabled: ${APP_API_DOCS:false}

# Journalisation en production : applicatif en INFO (ajustable via LOG_APP_LEVEL), cadriciels en WARN,
# sortie fichier pour la collecte. Aucune donnée sensible (voir docs/journalisation.md).
logging:
  level:
    root: WARN
    qc.levis.contrat: ${LOG_APP_LEVEL:INFO}
    org.springframework: WARN
  file:
    name: ${LOG_FILE:/var/log/contrat/app.log}
