# Profil "azure" : SSO fédéré via Microsoft Entra ID (Azure AD), OpenID Connect.
# Activation : --spring.profiles.active=azure (cumulable avec "prod")
# Les valeurs sont fournies par variables d'environnement (aucun secret en dur).
spring:
  security:
    oauth2:
      client:
        registration:
          azure:
            client-id: ${AZURE_CLIENT_ID}
            client-secret: ${AZURE_CLIENT_SECRET}
            scope: openid, profile, email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/azure"
            client-name: Microsoft Entra ID
        provider:
          azure:
            # Remplacer {tenant} par l'identifiant du locataire Entra de la Ville.
            issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0
            user-name-attribute: email
