databaseChangeLog:
  - changeSet:
      id: 025-1-publication-log
      author: vina
      changes:
        - createTable:
            tableName: publication_log
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: document_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: cible, type: VARCHAR(40), constraints: { nullable: false } }
              - column: { name: succes, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: url_cible, type: VARCHAR(2000) }
              - column: { name: message, type: VARCHAR(2000) }
              - column: { name: publie_par, type: VARCHAR(255) }
              - column: { name: publie_le, type: TIMESTAMP }
              - column: { name: tenant_id, type: BIGINT }
        - createIndex:
            tableName: publication_log
            indexName: idx_publication_document
            columns:
              - column: { name: document_id }
