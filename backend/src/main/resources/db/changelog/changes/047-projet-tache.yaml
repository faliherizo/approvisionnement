databaseChangeLog:
  - changeSet:
      id: 047-1-projet-temps
      author: levis
      comment: "Projets (porté du modèle SaisiesDeTemps.Projet de Nexu VINA)."
      changes:
        - createTable:
            tableName: projet_temps
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: code, type: VARCHAR(60), constraints: { nullable: false } }
              - column: { name: nom, type: VARCHAR(200), constraints: { nullable: false } }
              - column: { name: gestionnaire, type: VARCHAR(150) }
              - column: { name: budget_heures, type: DOUBLE }
              - column: { name: actif, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: projet_temps
            columnNames: tenant_id, code
            constraintName: uq_projet_tenant_code
  - changeSet:
      id: 047-2-tache-projet
      author: levis
      comment: "Tâches de projet assignables à une personne (porté de Projets.Tache de Nexu VINA)."
      changes:
        - createTable:
            tableName: tache_projet
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: projet_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: nom, type: VARCHAR(300), constraints: { nullable: false } }
              - column: { name: description, type: VARCHAR(2000) }
              - column: { name: type_tache, type: VARCHAR(40) }
              - column: { name: statut, type: VARCHAR(20), constraints: { nullable: false } }
              - column: { name: assigne_id, type: BIGINT }
              - column: { name: heures_estimees, type: DOUBLE }
              - column: { name: echeance, type: VARCHAR(10) }
              - column: { name: cree_le, type: TIMESTAMP, constraints: { nullable: false } }
        - createIndex:
            tableName: tache_projet
            indexName: ix_tacheprojet_projet
            columns:
              - column: { name: tenant_id }
              - column: { name: projet_id }
        - createIndex:
            tableName: tache_projet
            indexName: ix_tacheprojet_assigne
            columns:
              - column: { name: tenant_id }
              - column: { name: assigne_id }
