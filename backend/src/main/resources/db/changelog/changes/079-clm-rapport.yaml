databaseChangeLog:
  - changeSet:
      id: 079-1-clm-rapport
      author: levis
      comment: "Annexe 10 IQ, AF-37 (RST-42, ADR-032) : rapports enregistrés (type, période glissante, filtres, colonnes), exportés en CSV et Excel."
      changes:
        - createTable:
            tableName: clm_rapport
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: nom, type: VARCHAR(120), constraints: { nullable: false } }
              - column: { name: type, type: VARCHAR(30), constraints: { nullable: false } }
              - column: { name: periode_jours, type: INT, constraints: { nullable: false } }
              - column: { name: unite, type: VARCHAR(80) }
              - column: { name: type_contrat, type: VARCHAR(80) }
              - column: { name: statut, type: VARCHAR(20) }
              - column: { name: colonnes, type: VARCHAR(500) }
              - column: { name: proprietaire, type: VARCHAR(150), constraints: { nullable: false } }
              - column: { name: modifie_le, type: TIMESTAMP, constraints: { nullable: false } }
        - createIndex:
            tableName: clm_rapport
            indexName: ix_clm_rapport_tenant
            columns:
              - column: { name: tenant_id }
