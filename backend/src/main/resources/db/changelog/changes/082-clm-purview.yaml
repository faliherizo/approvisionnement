databaseChangeLog:
  - changeSet:
      id: 082-1-clm-politique-purview
      author: levis
      comment: "Annexe 10 IQ, SEC-27 (RST-53, ADR-036) : étiquettes Microsoft Purview (sensibilité, rétention) choisies par l'organisation, par défaut ou par type de contrat."
      changes:
        - createTable:
            tableName: clm_politique_purview
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: type_contrat, type: VARCHAR(80) }
              - column: { name: sensibilite_id, type: VARCHAR(64) }
              - column: { name: sensibilite_nom, type: VARCHAR(100) }
              - column: { name: retention_nom, type: VARCHAR(100) }
              - column: { name: retention_jours, type: INT }
              - column: { name: modifie_par, type: VARCHAR(150), constraints: { nullable: false } }
              - column: { name: modifie_le, type: TIMESTAMP, constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: clm_politique_purview
            columnNames: tenant_id, type_contrat
            constraintName: uk_clm_purview_type
  - changeSet:
      id: 082-2-clm-document-etiquettes
      author: levis
      comment: "Étiquettes Purview conservées avec chaque version de document, et leur propagation au fichier déposé dans Microsoft 365."
      changes:
        - addColumn:
            tableName: clm_document
            columns:
              - column: { name: etiquette_sensibilite_id, type: VARCHAR(64) }
              - column: { name: etiquette_sensibilite, type: VARCHAR(100) }
              - column: { name: etiquette_retention, type: VARCHAR(100) }
              - column: { name: etiquette_retention_jours, type: INT }
        - addColumn:
            tableName: clm_depot_m365
            columns:
              - column: { name: etiquette, type: VARCHAR(300) }
