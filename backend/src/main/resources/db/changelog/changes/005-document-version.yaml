databaseChangeLog:
  - changeSet:
      id: 005-1-document-version
      author: levis
      changes:
        - createTable:
            tableName: document_version
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: document_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: numero_version, type: INT, constraints: { nullable: false } }
              - column: { name: contenu_json, type: VARCHAR(20000) }
              - column: { name: note, type: VARCHAR(500) }
              - column: { name: cree_par, type: VARCHAR(255) }
              - column: { name: cree_le, type: TIMESTAMP }
        - addForeignKeyConstraint:
            baseTableName: document_version
            baseColumnNames: document_id
            referencedTableName: document
            referencedColumnNames: id
            constraintName: fk_document_version_document
