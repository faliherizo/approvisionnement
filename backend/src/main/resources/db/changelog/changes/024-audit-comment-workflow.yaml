databaseChangeLog:
  - changeSet:
      id: 024-1-audit-tenant
      author: vina
      changes:
        - addColumn:
            tableName: audit_log
            columns:
              - column: { name: tenant_id, type: BIGINT }
  - changeSet:
      id: 024-2-comment-resolution
      author: vina
      changes:
        - addColumn:
            tableName: commentaire
            columns:
              - column: { name: resolu_par, type: VARCHAR(255) }
              - column: { name: parent_id, type: BIGINT }
  - changeSet:
      id: 024-3-approval-workflow
      author: vina
      changes:
        - createTable:
            tableName: approval_workflow
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: nom, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: type, type: VARCHAR(40), constraints: { nullable: false } }
              - column: { name: actif, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: tenant_id, type: BIGINT }
        - createTable:
            tableName: approval_workflow_step
            columns:
              - column: { name: workflow_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: niveau, type: INT, constraints: { nullable: false } }
              - column: { name: role_requis, type: VARCHAR(40), constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: approval_workflow_step
            baseColumnNames: workflow_id
            constraintName: fk_workflow_step_workflow
            referencedTableName: approval_workflow
            referencedColumnNames: id
            onDelete: CASCADE
