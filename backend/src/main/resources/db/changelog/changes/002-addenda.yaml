databaseChangeLog:
  - changeSet:
      id: 002-1-addenda
      author: levis
      changes:
        - createTable:
            tableName: addenda
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: document_parent_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: numero, type: INT, constraints: { nullable: false } }
              - column: { name: objet, type: VARCHAR(500) }
              - column: { name: statut, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: emis_le, type: TIMESTAMP }
        - addForeignKeyConstraint:
            baseTableName: addenda
            baseColumnNames: document_parent_id
            referencedTableName: document
            referencedColumnNames: id
            constraintName: fk_addenda_document

  - changeSet:
      id: 002-2-addenda_change
      author: levis
      changes:
        - createTable:
            tableName: addenda_change
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: addenda_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: clause_id, type: BIGINT }
              - column: { name: code, type: VARCHAR(255) }
              - column: { name: ancien_texte, type: VARCHAR(8000) }
              - column: { name: nouveau_texte, type: VARCHAR(8000) }
        - addForeignKeyConstraint:
            baseTableName: addenda_change
            baseColumnNames: addenda_id
            referencedTableName: addenda
            referencedColumnNames: id
            constraintName: fk_addenda_change_addenda
