databaseChangeLog:
  - changeSet:
      id: 006-1-obligation
      author: levis
      changes:
        - createTable:
            tableName: obligation
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: document_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: titre, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: description, type: VARCHAR(2000) }
              - column: { name: type, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: statut, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: date_echeance, type: DATE }
              - column: { name: responsable, type: VARCHAR(255) }
        - addForeignKeyConstraint:
            baseTableName: obligation
            baseColumnNames: document_id
            referencedTableName: document
            referencedColumnNames: id
            constraintName: fk_obligation_document
