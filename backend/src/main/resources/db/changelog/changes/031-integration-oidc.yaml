databaseChangeLog:
  - changeSet:
      id: 031-1-integration-oidc
      author: levis
      changes:
        - createTable:
            tableName: integration_oidc
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT }
              - column: { name: actif, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: issuer, type: VARCHAR(500) }
              - column: { name: client_id, type: VARCHAR(300) }
              - column: { name: client_secret_chiffre, type: VARCHAR(1000) }
              - column: { name: scopes, type: VARCHAR(300), defaultValue: openid profile email }
              - column: { name: bouton_libelle, type: VARCHAR(200), defaultValue: Connexion gouvernementale }
              - column: { name: claim_courriel, type: VARCHAR(100), defaultValue: email }
              - column: { name: auto_provision, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: role_par_defaut, type: VARCHAR(30), defaultValue: REDACTEUR }
        - addUniqueConstraint:
            tableName: integration_oidc
            columnNames: tenant_id
            constraintName: uq_integration_oidc_tenant
