databaseChangeLog:
  - changeSet:
      id: 029-1-repertoire-depot
      author: levis
      changes:
        - createTable:
            tableName: repertoire_depot
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: user_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: chemin, type: VARCHAR(300), constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: repertoire_depot
            columnNames: user_id, chemin
            constraintName: uq_repertoire_user_chemin
