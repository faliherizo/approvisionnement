databaseChangeLog:
  - changeSet:
      id: 076-1-clm-diffusion-m365
      author: levis
      comment: "Annexe 10 IQ, TI-01 (RST-45, ADR-029) : dépôt SharePoint/OneDrive et avis Teams des trousses terminées, par le connecteur Microsoft 365 de la plateforme."
      changes:
        - createTable:
            tableName: clm_diffusion_m365
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false, unique: true, uniqueConstraintName: uk_clm_diffusion_m365_tenant } }
              - column: { name: actif, type: BOOLEAN, constraints: { nullable: false } }
              - column: { name: bibliotheque, type: VARCHAR(12), constraints: { nullable: false } }
              - column: { name: dossier, type: VARCHAR(300), constraints: { nullable: false } }
              - column: { name: deposer_preuve, type: BOOLEAN, constraints: { nullable: false } }
              - column: { name: avis_teams, type: BOOLEAN, constraints: { nullable: false } }
              - column: { name: modifie_par, type: VARCHAR(150), constraints: { nullable: false } }
              - column: { name: modifie_le, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
        - createTable:
            tableName: clm_depot_m365
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: trousse_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: nature, type: VARCHAR(16), constraints: { nullable: false } }
              - column: { name: document_id, type: BIGINT }
              - column: { name: cle_idempotence, type: VARCHAR(160), constraints: { nullable: false } }
              - column: { name: statut, type: VARCHAR(12), constraints: { nullable: false } }
              - column: { name: tentatives, type: INT, constraints: { nullable: false } }
              - column: { name: prochain_essai, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: derniere_erreur, type: VARCHAR(1000) }
              - column: { name: url, type: VARCHAR(2000) }
              - column: { name: cree_le, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: depose_le, type: TIMESTAMP }
        - createIndex:
            tableName: clm_depot_m365
            indexName: ix_clm_depot_m365_cle
            unique: true
            columns:
              - column: { name: cle_idempotence }
        - createIndex:
            tableName: clm_depot_m365
            indexName: ix_clm_depot_m365_statut
            columns:
              - column: { name: statut }
              - column: { name: prochain_essai }
        - createIndex:
            tableName: clm_depot_m365
            indexName: ix_clm_depot_m365_tenant
            columns:
              - column: { name: tenant_id }
              - column: { name: trousse_id }
