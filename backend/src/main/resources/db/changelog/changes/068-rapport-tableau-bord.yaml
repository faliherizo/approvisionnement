databaseChangeLog:
  - changeSet:
      id: 068-1-rapport-tableau-bord
      author: levis
      comment: "CHU 6.04 : tableaux de bord configurables (indicateurs en JSON, propriétaire, partage à l'organisation)."
      changes:
        - createTable:
            tableName: rapport_tableau_bord
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: nom, type: VARCHAR(120), constraints: { nullable: false } }
              - column: { name: proprietaire, type: VARCHAR(150), constraints: { nullable: false } }
              - column: { name: partage, type: BOOLEAN, constraints: { nullable: false } }
              - column: { name: indicateurs_json, type: VARCHAR(20000), constraints: { nullable: false } }
              - column: { name: modifie_le, type: TIMESTAMP, constraints: { nullable: false } }
        - createIndex:
            tableName: rapport_tableau_bord
            indexName: ix_rapport_tableau_bord_tenant
            columns:
              - column: { name: tenant_id }
