databaseChangeLog:
  - changeSet:
      id: 004-1-user-mfa-columns
      author: levis
      changes:
        - addColumn:
            tableName: app_user
            columns:
              - column: { name: mfa_active, type: BOOLEAN, defaultValueBoolean: false }
              - column: { name: mfa_methode, type: VARCHAR(20) }
              - column: { name: totp_secret, type: VARCHAR(64) }

  - changeSet:
      id: 004-2-user-security-question
      author: levis
      changes:
        - createTable:
            tableName: user_security_question
            columns:
              - column: { name: user_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: question, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: reponse_hash, type: VARCHAR(255), constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: user_security_question
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_user_security_question_user
