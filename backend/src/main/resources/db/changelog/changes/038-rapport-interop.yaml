databaseChangeLog:
  - changeSet:
      id: 038-1-critere-recherche
      author: levis
      changes:
        - createTable:
            tableName: critere_recherche_sauve
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: utilisateur, type: VARCHAR(150), constraints: { nullable: false } }
              - column: { name: formulaire_id, type: BIGINT }
              - column: { name: nom, type: VARCHAR(200), constraints: { nullable: false } }
              - column: { name: criteres_json, type: TEXT }
  - changeSet:
      id: 038-2-api-client
      author: levis
      changes:
        - createTable:
            tableName: api_client
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: client_id, type: VARCHAR(80), constraints: { nullable: false, unique: true, uniqueConstraintName: uq_api_client_id } }
              - column: { name: secret_hash, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: nom, type: VARCHAR(200), constraints: { nullable: false } }
              - column: { name: actif, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: scopes, type: VARCHAR(500) }
  - changeSet:
      id: 038-3-api-token
      author: levis
      changes:
        - createTable:
            tableName: api_token
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: client_id, type: VARCHAR(80), constraints: { nullable: false } }
              - column: { name: token_hash, type: VARCHAR(100), constraints: { nullable: false, unique: true, uniqueConstraintName: uq_api_token_hash } }
              - column: { name: expire_le, type: TIMESTAMP, constraints: { nullable: false } }
