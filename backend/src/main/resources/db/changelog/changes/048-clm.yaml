databaseChangeLog:
  - changeSet:
      id: 048-1-clm-trousse
      author: levis
      comment: "CLM IQ 2026-6370-0005 : trousses (ST-03), corrélation Salesforce (ST-06/ST-12)."
      changes:
        - createTable:
            tableName: clm_trousse
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: reference, type: VARCHAR(60), constraints: { nullable: false } }
              - column: { name: titre, type: VARCHAR(250), constraints: { nullable: false } }
              - column: { name: type_contrat, type: VARCHAR(80) }
              - column: { name: unite, type: VARCHAR(120) }
              - column: { name: source, type: VARCHAR(20), constraints: { nullable: false } }
              - column: { name: sf_dossier_id, type: VARCHAR(80) }
              - column: { name: sf_recupere_le, type: TIMESTAMP }
              - column: { name: statut, type: VARCHAR(20), constraints: { nullable: false } }
              - column: { name: risque, type: VARCHAR(10), constraints: { nullable: false } }
              - column: { name: proprietaire, type: VARCHAR(150), constraints: { nullable: false } }
              - column: { name: echeance, type: DATE }
              - column: { name: modele_id, type: BIGINT }
              - column: { name: valeurs_json, type: TEXT }
              - column: { name: rappel_frequence_jours, type: INT, constraints: { nullable: false } }
              - column: { name: rappels_max, type: INT, constraints: { nullable: false } }
              - column: { name: copies, type: VARCHAR(1000) }
              - column: { name: cree_le, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: maj_le, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: version, type: BIGINT, constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: clm_trousse
            columnNames: tenant_id, reference
            constraintName: uk_clm_trousse_ref
        - createIndex:
            tableName: clm_trousse
            indexName: ix_clm_trousse_statut
            columns:
              - column: { name: tenant_id }
              - column: { name: statut }
  - changeSet:
      id: 048-2-clm-document
      author: levis
      comment: "Versions de documents PDF/Word jusqu'à 25 Mo (ST-04, RST-16)."
      changes:
        - createTable:
            tableName: clm_document
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: trousse_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: cle_document, type: VARCHAR(40), constraints: { nullable: false } }
              - column: { name: version, type: INT, constraints: { nullable: false } }
              - column: { name: nom, type: VARCHAR(200), constraints: { nullable: false } }
              - column: { name: type, type: VARCHAR(10), constraints: { nullable: false } }
              - column: { name: taille, type: BIGINT, constraints: { nullable: false } }
              - column: { name: empreinte, type: VARCHAR(64), constraints: { nullable: false } }
              - column: { name: statut, type: VARCHAR(12), constraints: { nullable: false } }
              - column: { name: analyse, type: VARCHAR(12), constraints: { nullable: false } }
              - column: { name: auteur, type: VARCHAR(150), constraints: { nullable: false } }
              - column: { name: motif, type: VARCHAR(500) }
              - column: { name: contenu, type: "${blob.type}", constraints: { nullable: false } }
              - column: { name: cree_le, type: TIMESTAMP, constraints: { nullable: false } }
        - createIndex:
            tableName: clm_document
            indexName: ix_clm_doc_trousse
            columns:
              - column: { name: tenant_id }
              - column: { name: trousse_id }
  - changeSet:
      id: 048-3-clm-participant-etape-decision
      author: levis
      comment: "Participants, étapes de parcours séquentiel/parallèle/mixte et décisions (ST-07/ST-08)."
      changes:
        - createTable:
            tableName: clm_participant
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: trousse_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: nom, type: VARCHAR(150), constraints: { nullable: false } }
              - column: { name: courriel, type: VARCHAR(150), constraints: { nullable: false } }
              - column: { name: telephone, type: VARCHAR(30) }
              - column: { name: role_contrat, type: VARCHAR(60), constraints: { nullable: false } }
              - column: { name: externe, type: BOOLEAN, constraints: { nullable: false } }
              - column: { name: niveau_identite, type: VARCHAR(12), constraints: { nullable: false } }
              - column: { name: question_identite, type: VARCHAR(250) }
              - column: { name: reponse_identite_hash, type: VARCHAR(64) }
        - createIndex:
            tableName: clm_participant
            indexName: ix_clm_part_trousse
            columns:
              - column: { name: tenant_id }
              - column: { name: trousse_id }
        - createTable:
            tableName: clm_etape
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: trousse_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: cle_etape, type: VARCHAR(60), constraints: { nullable: false } }
              - column: { name: libelle, type: VARCHAR(150), constraints: { nullable: false } }
              - column: { name: phase, type: INT, constraints: { nullable: false } }
              - column: { name: type, type: VARCHAR(12), constraints: { nullable: false } }
              - column: { name: affectations_json, type: TEXT, constraints: { nullable: false } }
              - column: { name: quorum, type: INT, constraints: { nullable: false } }
              - column: { name: politique, type: VARCHAR(24), constraints: { nullable: false } }
              - column: { name: delai_jours, type: INT }
              - column: { name: statut, type: VARCHAR(12), constraints: { nullable: false } }
              - column: { name: activee_le, type: TIMESTAMP }
              - column: { name: echeance, type: TIMESTAMP }
              - column: { name: terminee_le, type: TIMESTAMP }
              - column: { name: rappels_envoyes, type: INT, constraints: { nullable: false } }
              - column: { name: dernier_rappel, type: TIMESTAMP }
              - column: { name: retard_signale, type: BOOLEAN, constraints: { nullable: false } }
        - createIndex:
            tableName: clm_etape
            indexName: ix_clm_etape_trousse
            columns:
              - column: { name: tenant_id }
              - column: { name: trousse_id }
        - createIndex:
            tableName: clm_etape
            indexName: ix_clm_etape_statut
            columns:
              - column: { name: statut }
        - createTable:
            tableName: clm_decision
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: trousse_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: etape_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: acteur, type: VARCHAR(150), constraints: { nullable: false } }
              - column: { name: nature, type: VARCHAR(10), constraints: { nullable: false } }
              - column: { name: commentaire, type: VARCHAR(2000) }
              - column: { name: decide_le, type: TIMESTAMP, constraints: { nullable: false } }
        - createIndex:
            tableName: clm_decision
            indexName: ix_clm_dec_etape
            columns:
              - column: { name: tenant_id }
              - column: { name: etape_id }
  - changeSet:
      id: 048-4-clm-invitation-evenement
      author: levis
      comment: "Invitations de signature avec vérification d'identité (ST-09, RST-17) et journal scellé (ST-10/ST-14)."
      changes:
        - createTable:
            tableName: clm_invitation
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: trousse_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: etape_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: participant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: jeton_hash, type: VARCHAR(64), constraints: { nullable: false } }
              - column: { name: expire_le, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: statut, type: VARCHAR(12), constraints: { nullable: false } }
              - column: { name: niveau, type: VARCHAR(12), constraints: { nullable: false } }
              - column: { name: code_hash, type: VARCHAR(64) }
              - column: { name: code_expire_le, type: TIMESTAMP }
              - column: { name: tentatives, type: INT, constraints: { nullable: false } }
              - column: { name: verifiee_le, type: TIMESTAMP }
              - column: { name: consentement_le, type: TIMESTAMP }
              - column: { name: signee_le, type: TIMESTAMP }
              - column: { name: nom_signe, type: VARCHAR(150) }
              - column: { name: ip, type: VARCHAR(64) }
              - column: { name: agent, type: VARCHAR(300) }
              - column: { name: attestation_json, type: TEXT }
              - column: { name: champs_json, type: TEXT }
              - column: { name: motif, type: VARCHAR(1000) }
        - createIndex:
            tableName: clm_invitation
            indexName: ix_clm_inv_jeton
            unique: true
            columns:
              - column: { name: jeton_hash }
        - createIndex:
            tableName: clm_invitation
            indexName: ix_clm_inv_trousse
            columns:
              - column: { name: tenant_id }
              - column: { name: trousse_id }
        - createTable:
            tableName: clm_evenement
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: trousse_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: sequence_no, type: BIGINT, constraints: { nullable: false } }
              - column: { name: type, type: VARCHAR(60), constraints: { nullable: false } }
              - column: { name: acteur, type: VARCHAR(150), constraints: { nullable: false } }
              - column: { name: horodatage, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: detail, type: VARCHAR(2000) }
              - column: { name: empreinte_precedente, type: VARCHAR(64), constraints: { nullable: false } }
              - column: { name: empreinte, type: VARCHAR(64), constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: clm_evenement
            columnNames: trousse_id, sequence_no
            constraintName: uk_clm_evt_seq
        - createIndex:
            tableName: clm_evenement
            indexName: ix_clm_evt_tenant
            columns:
              - column: { name: tenant_id }
              - column: { name: horodatage }
  - changeSet:
      id: 048-5-clm-modele-message-sortie-analyse
      author: levis
      comment: "Modèles versionnés (ST-05), messages (ST-11), boîte d'envoi Salesforce (ST-12), analyses IA (ST-15)."
      changes:
        - createTable:
            tableName: clm_modele
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: cle_modele, type: VARCHAR(40), constraints: { nullable: false } }
              - column: { name: version_no, type: INT, constraints: { nullable: false } }
              - column: { name: nom, type: VARCHAR(200), constraints: { nullable: false } }
              - column: { name: categorie, type: VARCHAR(80) }
              - column: { name: statut, type: VARCHAR(12), constraints: { nullable: false } }
              - column: { name: proprietaire, type: VARCHAR(150), constraints: { nullable: false } }
              - column: { name: groupes, type: VARCHAR(1000) }
              - column: { name: corps, type: TEXT }
              - column: { name: champs_json, type: TEXT }
              - column: { name: clauses_json, type: TEXT }
              - column: { name: parcours_json, type: TEXT }
              - column: { name: cree_le, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: maj_le, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: verrou, type: BIGINT, constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: clm_modele
            columnNames: tenant_id, cle_modele, version_no
            constraintName: uk_clm_modele_version
        - createTable:
            tableName: clm_modele_message
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: evenement, type: VARCHAR(12), constraints: { nullable: false } }
              - column: { name: canal, type: VARCHAR(12), constraints: { nullable: false } }
              - column: { name: sujet, type: VARCHAR(200), constraints: { nullable: false } }
              - column: { name: corps, type: VARCHAR(4000), constraints: { nullable: false } }
              - column: { name: actif, type: BOOLEAN, constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: clm_modele_message
            columnNames: tenant_id, evenement, canal
            constraintName: uk_clm_msg
        - createTable:
            tableName: clm_sortie
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: trousse_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: sf_dossier_id, type: VARCHAR(80), constraints: { nullable: false } }
              - column: { name: evenement, type: VARCHAR(40), constraints: { nullable: false } }
              - column: { name: cle_idempotence, type: VARCHAR(160), constraints: { nullable: false } }
              - column: { name: correlation_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: payload_json, type: TEXT, constraints: { nullable: false } }
              - column: { name: statut, type: VARCHAR(12), constraints: { nullable: false } }
              - column: { name: tentatives, type: INT, constraints: { nullable: false } }
              - column: { name: prochain_essai, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: derniere_erreur, type: VARCHAR(1000) }
              - column: { name: cree_le, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: envoye_le, type: TIMESTAMP }
        - createIndex:
            tableName: clm_sortie
            indexName: ix_clm_sortie_cle
            unique: true
            columns:
              - column: { name: cle_idempotence }
        - createIndex:
            tableName: clm_sortie
            indexName: ix_clm_sortie_statut
            columns:
              - column: { name: statut }
              - column: { name: prochain_essai }
        - createTable:
            tableName: clm_analyse
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: trousse_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: document_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: resultat_json, type: TEXT, constraints: { nullable: false } }
              - column: { name: statut, type: VARCHAR(10), constraints: { nullable: false } }
              - column: { name: lancee_par, type: VARCHAR(150), constraints: { nullable: false } }
              - column: { name: revisee_par, type: VARCHAR(150) }
              - column: { name: justification, type: VARCHAR(2000) }
              - column: { name: cree_le, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: revisee_le, type: TIMESTAMP }
        - createIndex:
            tableName: clm_analyse
            indexName: ix_clm_analyse_trousse
            columns:
              - column: { name: tenant_id }
              - column: { name: trousse_id }
