server:
  port: 8080

spring:
  application:
    name: contrat-backend
  # Spring Boot 4 sert le JSON avec Jackson 3 par défaut ; l'application et ses DTO restent en Jackson 2 (module
  # spring-boot-jackson2) jusqu'à leur migration : les convertisseurs HTTP utilisent donc Jackson 2.
  http:
    converters:
      preferred-json-mapper: jackson2
  # Serveur SMTP du canal COURRIEL (app.notification.courriel.mode=smtp) ; secrets par variables d'environnement.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 20000
  # Borne de transport ; chaque module applique la sienne (document : 10 Mo, clm : app.clm.documents.taille-max-octets).
  servlet:
    multipart:
      # Fichiers lus à la demande du contrôleur, donc après la décision d'autorisation (SEC-32) : un rôle non autorisé
      # ne fait pas recevoir de téléversement au serveur.
      resolve-lazily: true
      max-file-size: 30MB
      max-request-size: 32MB
  # Profil par défaut : H2 en mémoire (dév + tests e2e Playwright).
  datasource:
    url: jdbc:h2:mem:contrat;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    # Pool dimensionné pour la charge visée (addenda 3, Q38 : 500 utilisateurs concurrents) ; 10 connexions par défaut
    # épuisaient le pool lors des pointes. Hérité par les profils prod et azure.
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:30}
      connection-timeout: ${DB_POOL_TIMEOUT_MS:10000}
  jpa:
    hibernate:
      # Le schéma est géré par Liquibase, pas par Hibernate.
      ddl-auto: none
    open-in-view: false
    show-sql: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  h2:
    console:
      # Console d'administration de la base en mémoire : fermée par défaut, ouverte à la demande en poste de développement.
      enabled: ${H2_CONSOLE:false}
      path: /h2-console

# Documentation OpenAPI 3.0 / Swagger UI
springdoc:
  # Schémas nommés par leur nom pleinement qualifié : deux DTO de même nom simple dans des modules différents
  # (ex. ModeleRequest du CLM et des notifications) ne s'écrasent plus dans la spécification publiée.
  use-fqn: true
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# Paramètres applicatifs (JWT). En production : variable d'environnement + secret géré.
app:
  # Canal COURRIEL (ADR-002) : « simulation » (journal seulement) ou « smtp » (spring.mail.*, ex. relais de
  # l'organisation ; bac à sable : Mailpit). L'expéditeur appartient au domaine configuré (SPF, DKIM).
  # Antivirus des fichiers reçus (CHU 7.08, ADR-027) : « signatures » (EICAR) sur un poste ; « clamav » en exploitation,
  # avec le démon clamd joignable à ANTIVIRUS_CLAMAV_HOTE:ANTIVIRUS_CLAMAV_PORT.
  antivirus:
    mode: ${ANTIVIRUS_MODE:signatures}
    clamav:
      hote: ${ANTIVIRUS_CLAMAV_HOTE:}
      port: ${ANTIVIRUS_CLAMAV_PORT:3310}
      delai-ms: ${ANTIVIRUS_CLAMAV_DELAI_MS:30000}
  # Défi anti-robot des formulaires (CHU 3.07, ADR-026) : « simulation » par défaut ; « siteverify » en exploitation,
  # avec Cloudflare Turnstile ou hCaptcha. La clé secrète vient de l'environnement seulement, jamais d'ici.
  saisie:
    captcha:
      mode: ${CAPTCHA_MODE:simulation}
      fournisseur: ${CAPTCHA_FOURNISSEUR:TURNSTILE}
      cle-site: ${CAPTCHA_CLE_SITE:}
      secret: ${CAPTCHA_SECRET:}
      url: ${CAPTCHA_URL:}
  notification:
    courriel:
      mode: ${NOTIFICATION_COURRIEL_MODE:simulation}
      expediteur: ${NOTIFICATION_COURRIEL_EXPEDITEUR:no-reply@contrats.example}
    # SMS (code de vérification du signataire, RST-17) : « twilio » en exploitation, avec le compte Vina lu dans
    # l'environnement (TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM) ; jamais de valeur ici.
    sms:
      mode: ${NOTIFICATION_SMS_MODE:simulation}
      twilio:
        url: ${TWILIO_URL:https://api.twilio.com}
        account-sid: ${TWILIO_ACCOUNT_SID:}
        auth-token: ${TWILIO_AUTH_TOKEN:}
        from: ${TWILIO_FROM:}
  amorcage:
    # Organisations de démonstration (data/tenants-demo.json : tenant IQ et un compte par profil client). Faux en production.
    tenants-demo: ${APP_TENANTS_DEMO:true}
  jwt:
    secret: ${JWT_SECRET:changez-moi-cette-cle-secrete-de-256-bits-minimum-pour-la-ville-de-levis}
    expiration-ms: 3600000   # 1 heure
  # Politique de session par défaut (ST-01) ; chaque organisation peut fixer la sienne (administration technique).
  session:
    inactivite-minutes: ${APP_SESSION_INACTIVITE_MINUTES:60}
    duree-max-minutes: ${APP_SESSION_DUREE_MAX_MINUTES:480}
  cookie:
    secure: ${COOKIE_SECURE:false}      # true en production (HTTPS)
    same-site: ${COOKIE_SAMESITE:Lax}
  # Médiathèque (vidéos des vitrines et de l'aide, sous-titres) : un répertoire monté en production (volume).
  media:
    repertoire: ${APP_MEDIA_REPERTOIRE:./data/media}
  cors:
    # Motifs d'origines autorisées (compatibles allowCredentials). En dev/Docker,
    # tout localhost est accepté ; en production, restreindre via APP_CORS_ALLOWED_ORIGINS.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:*}
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:llama3.1}
      # Jetons produits au plus par réponse (num_predict) : borne la durée d'une génération sur processeur.
      longueur-max: ${OLLAMA_LONGUEUR_MAX:512}
  publication:
    # Répertoire de dépôt par défaut (SharePoint/OneDrive/Teams) quand aucun n'est saisi.
    dossier-defaut: ${PUBLICATION_DOSSIER_DEFAUT:Contrats}
    simulateur:
      # Emplacement où le mode simulation écrit réellement les fichiers déposés (visualisables).
      repertoire: ${PUBLICATION_SIMULATEUR_REPERTOIRE:data/simulateur}
  securite:
    sortant:
      # Hôtes:ports joignables malgré la garde anti-SSRF (adresses internes) : bacs à sable locaux (Keycloak, Salesforce).
      autorises: ${APP_SORTANT_AUTORISES:localhost:8180,127.0.0.1:8180,localhost:8099,127.0.0.1:8099}
    connexion:
      # Frein à la force brute : au-delà de N échecs pour un même courriel dans la fenêtre, la connexion est suspendue.
      echecs-max: ${APP_CONNEXION_ECHECS_MAX:10}
      fenetre-minutes: ${APP_CONNEXION_FENETRE_MINUTES:15}
    pare-feu:
      # Limitation de débit par adresse du client et par famille, sur toute la surface sans session (SEC-33). Chaque
      # route publique (securite/donnees/surface-publique.json) appartient à une famille : RoutesSecuriseesIntegrationTest
      # le vérifie. Relever le seuil pour une intégration en lot volumineuse plutôt que retirer sa famille.
      max-par-minute: ${APP_PARE_FEU_MAX_PAR_MINUTE:300}
      familles: /api/auth/login,/api/auth/logout,/api/auth/config,/api/auth/oidc/,/api/auth/saml/,/api/signature/,/api/clm/portail/,/api/clm/integration/,/scim/v2/,/api/tenants,/api/vitrines/,/api/media/,/api/health,/api/public/
  crypto:
    # Clé et sel (hex) de chiffrement des secrets stockés en base (ex. secret client M365 par tenant).
    # OBLIGATOIRE en production : fournir via variables d'environnement, jamais en dur.
    cle: ${APP_CRYPTO_KEY:changez-moi-cle-de-chiffrement-des-secrets}
    sel: ${APP_CRYPTO_SALT:5c0ff33a1b2c3d4e}
  m365:
    # Bases d'API par défaut = Microsoft réel. Pour valider avec un simulateur, pointer ces URL vers
    # le stub (ex. http://localhost:8099/v1.0 et http://localhost:8099) sans changer de code.
    graph-base-url: ${M365_GRAPH_BASE_URL:https://graph.microsoft.com/v1.0}
    login-base-url: ${M365_LOGIN_BASE_URL:https://login.microsoftonline.com}
  # SAP : configuration désormais PAR TENANT (Paramètres → Intégration SAP), chiffrée en base — plus
  # de config globale ici. Voir docs/tutoriel-sap.md et docs/tutoriel-sap-sandbox.md.
  # CLM IQ 2026-6370-0005 : trousses, signature probante, preuve, Salesforce.
  # Valeurs de PLATEFORME : chaque organisation remplace les siennes depuis son espace d'administration
  # (UI-21 intégrations, UI-22 paramètres, listes de référence) ; environnement, preuve et planificateur restent ici.
  clm:
    environnement: ${CLM_ENVIRONNEMENT:DEV}
    # Fuseau qui fixe « aujourd'hui » pour les échéances en date (tâches assignées) ; les horodatages restent en UTC.
    fuseau: ${CLM_FUSEAU:America/Toronto}
    portail-url: ${CLM_PORTAIL_URL:http://localhost:5173/portail}
    documents:
      taille-max-octets: ${CLM_TAILLE_MAX_OCTETS:26214400}   # 25 Mo (NF-07)
      # Plafond qu'aucune organisation ne dépasse : aligné sur spring.servlet.multipart.max-file-size.
      plafond-octets: ${CLM_PLAFOND_OCTETS:31457280}
    invitation:
      validite-jours: ${CLM_INVITATION_JOURS:14}
    preuve:
      # Clé de scellement des dossiers de preuve et de l'horodatage local. OBLIGATOIRE en production.
      cle: ${CLM_PREUVE_CLE:changez-moi-cle-de-scellement-des-preuves}
    # Cachet électronique X.509 (CAdES/PAdES) des preuves : magasin PKCS#12 d'une autorité reconnue en production ;
    # vide → certificat de démonstration autosigné. Horodatage RFC 3161 si une autorité est désignée.
    cachet:
      magasin: ${CLM_CACHET_MAGASIN:}
      mot-de-passe: ${CLM_CACHET_MOT_DE_PASSE:}
      tsa-url: ${CLM_CACHET_TSA_URL:}
    # Attestation de signature (ST-09) : « cachet » = CAdES par le cachet X.509, horodatée RFC 3161 (recommandé) ;
    # « local » = scellement HMAC de la plateforme, non vérifiable hors d'elle.
    signature:
      fournisseur: ${CLM_SIGNATURE_FOURNISSEUR:local}
    # Conversion Word → PDF/A des contrats issus d'un gabarit Word (addenda 4, Q22 ; ADR-018).
    conversion:
      # « service » : service LibreOffice externe à l'API Gotenberg (recommandé, LibreOffice isolé du serveur) ;
      # « soffice » : LibreOffice installé localement et appelé en ligne de commande.
      mode: ${CLM_CONVERSION_MODE:soffice}
      url: ${CLM_CONVERSION_URL:http://localhost:3000}
      soffice: ${CLM_CONVERSION_SOFFICE:soffice}
      delai-secondes: ${CLM_CONVERSION_DELAI_SECONDES:120}
    # Chiffrement au repos par une clé dédiée à chaque organisation (Annexe 10, SEC-28 ; ADR-037). La clé maîtresse locale
    # (32 octets en Base64) vient d'un secret de déploiement, jamais du dépôt ; vide → clé de développement, refusée si
    # CLM_ENVIRONNEMENT=PROD. Profil « azure-kms » : la clé maîtresse reste dans Azure Key Vault (wrapkey/unwrapkey).
    chiffrement:
      cle-maitresse: ${CLM_CLE_MAITRESSE:}
      cle-maitresse-id: ${CLM_CLE_MAITRESSE_ID:locale-1}
      azure:
        vault-url: ${CLM_KEYVAULT_URL:}
        cle: ${CLM_KEYVAULT_CLE:}
        tenant-id: ${CLM_KEYVAULT_TENANT_ID:}
        client-id: ${CLM_KEYVAULT_CLIENT_ID:}
        client-secret: ${CLM_KEYVAULT_CLIENT_SECRET:}
    planificateur:
      actif: ${CLM_PLANIFICATEUR_ACTIF:true}
      delai-ms: ${CLM_PLANIFICATEUR_DELAI_MS:60000}
    salesforce:
      # simulation (défaut, données de démonstration) | rest (API Salesforce réelle, OAuth2 client credentials)
      mode: ${CLM_SALESFORCE_MODE:simulation}
      instance-url: ${CLM_SALESFORCE_INSTANCE_URL:}
      token-url: ${CLM_SALESFORCE_TOKEN_URL:}
      client-id: ${CLM_SALESFORCE_CLIENT_ID:}
      client-secret: ${CLM_SALESFORCE_CLIENT_SECRET:}
      objet: ${CLM_SALESFORCE_OBJET:FundingRequest}
      version-api: ${CLM_SALESFORCE_VERSION_API:v60.0}
      # Domaines qu'une organisation peut désigner (instance, jetons) : protection contre la falsification de requêtes.
      hotes-autorises: ${CLM_SALESFORCE_HOTES_AUTORISES:salesforce.com,force.com}

# Journalisation (voir docs/journalisation.md). Niveaux pilotés ici, ajustables sans redéploiement
# via LOG_APP_LEVEL. Aucune donnée sensible n'est journalisée (Loi 25).
logging:
  level:
    root: INFO
    qc.levis.contrat: ${LOG_APP_LEVEL:DEBUG}   # applicatif verbeux en dev
    org.springframework: WARN
    org.hibernate: WARN
    liquibase: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

# Le relais SMTP n'entre pas dans la santé du serveur : un courriel non remis est relancé, pas une panne.
management:
  health:
    mail:
      enabled: false
