# Essais d'intégration : les adaptateurs sortants (OIDC, SAP, SAML, Salesforce, rappels) parlent à de faux serveurs locaux
# (127.0.0.1, port aléatoire). La garde anti-SSRF est donc ouverte ici ; DurcissementIntegrationTest la réactive et l'éprouve.
app.securite.sortant.autorises=*
# Les essais d'intégration enchaînent des milliers d'appels depuis la même adresse : le pare-feu (SEC-33) est éprouvé à
# part, avec un seuil bas, par RoutesSecuriseesIntegrationTest et PareFeuFilterTest.
app.securite.pare-feu.max-par-minute=100000000
