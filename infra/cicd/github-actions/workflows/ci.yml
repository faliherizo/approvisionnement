# Orchestrateur CI — sur chaque Pull Request : qualité + plan Terraform (aucun déploiement).
# Sécurise la branche principale : rien n'est fusionné sans build/tests verts et plan revu.
name: ci

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  build-test:
    uses: ./.github/workflows/reusable-build-test.yml

  plan-aws:
    uses: ./.github/workflows/reusable-terraform.yml
    with:
      cloud: aws
      working-directory: infra/terraform/aws
      action: plan
    secrets:
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

  plan-azure:
    uses: ./.github/workflows/reusable-terraform.yml
    with:
      cloud: azure
      working-directory: infra/terraform/azure
      action: plan
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
