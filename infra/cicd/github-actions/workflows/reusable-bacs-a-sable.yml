# Réutilisable : éprouve la plateforme contre les applications externes des bacs à sable (ICP OpenSSL, pyHanko,
# Gotenberg, veraPDF, Mailpit), par le réseau et aux protocoles réels : scénarios e2e BS-01 à BS-08 et scripts de
# validation (infra/bacs-a-sable/ci.sh). Aucun secret : l'ICP et ses clés sont créées à la volée dans le runner.
name: reusable-bacs-a-sable

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: "17"
      node-version:
        type: string
        default: "20"

permissions:
  contents: read

jobs:
  bacs-a-sable:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Bacs à sable — services, serveur, scénarios e2e et validation
        run: infra/bacs-a-sable/ci.sh
      - name: Rapports (veraPDF, pyHanko, OpenSSL, Playwright, journaux)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bacs-a-sable
          path: |
            infra/bacs-a-sable/resultats/
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
