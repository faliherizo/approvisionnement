# Réutilisable : cycle Terraform (format, validation, lint, sécurité, plan OU apply) pour un cloud.
# - action=plan  → sur les PR : publie le plan en artefact/commentaire, n'applique rien.
# - action=apply → sur main / manuel : applique après approbation (gérée par l'orchestrateur).
name: reusable-terraform

on:
  workflow_call:
    inputs:
      cloud:            { type: string, required: true }   # aws | azure
      working-directory: { type: string, required: true }  # infra/terraform/aws | .../azure
      action:           { type: string, default: "plan" }  # plan | apply
      region:           { type: string, default: "ca-central-1" }
    secrets:
      # AWS
      AWS_DEPLOY_ROLE_ARN: { required: false }
      # Azure
      AZURE_CLIENT_ID:       { required: false }
      AZURE_TENANT_ID:       { required: false }
      AZURE_SUBSCRIPTION_ID: { required: false }

permissions:
  id-token: write   # OIDC
  contents: read
  pull-requests: write  # commentaire de plan

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - name: Authentification AWS (OIDC)
        if: inputs.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.region }}

      - name: Authentification Azure (OIDC)
        if: inputs.cloud == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: ./.github/actions/setup-tools

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Lint (TFLint)
        uses: terraform-linters/setup-tflint@v4
        with: { tflint_version: latest }
      - run: tflint --init && tflint -f compact

      - name: Analyse de sécurité (Checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ inputs.working-directory }}
          quiet: true
          soft_fail: true   # ne bloque pas au début ; passer à false une fois les exceptions triées

      - name: Plan
        if: inputs.action == 'plan'
        run: terraform plan -input=false -no-color -out=tfplan | tee plan.txt

      - name: Publier le plan (commentaire PR)
        if: inputs.action == 'plan' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ inputs.working-directory }}/plan.txt', 'utf8').slice(0, 60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: `#### Terraform plan — \`${{ inputs.cloud }}\`\n\`\`\`\n${plan}\n\`\`\``
            });

      - name: Apply
        if: inputs.action == 'apply'
        run: terraform apply -input=false -auto-approve
