# Réutilisable : compile et teste le backend (Maven + JaCoCo) et le frontend (npm).
# Appelé par les orchestrateurs (ci.yml, cd-*.yml) via `uses:`.
name: reusable-build-test

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: "21"
      node-version:
        type: string
        default: "20"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
      - name: Tests + couverture (JaCoCo)
        run: mvn -B -f backend/pom.xml verify
      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
