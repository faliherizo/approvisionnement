# Bacs à sable des intégrations et des services externes d'IQ, à lancer à côté de la plateforme : aucune donnée
# réelle, aucun secret réel. Chaque service est une application externe, jointe par le réseau aux protocoles du
# service réel ; les outils de conformité (veraPDF, pyHanko, LibreOffice) sont les logiciels officiels eux-mêmes.
#   docker compose -f infra/bacs-a-sable/docker-compose.yml up -d
# Guide : docs/Dossier_IQ_2026-6370-0005/12-Bacs-a-sable/guide_bacs_a_sable.md
services:
  # Annuaire d'entreprise fictif (OIDC et SAML 2.0) : royaume « iq », un compte par profil, groupes = domaines d'affaires.
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: iq-bac-keycloak
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin-bac-a-sable}
    volumes:
      - ./keycloak/realm-iq.json:/opt/keycloak/data/import/realm-iq.json:ro
    ports:
      - "8180:8180"

  # API REST Salesforce imitée (OAuth client credentials, FundingRequest, SOQL, PATCH), journal et panne simulée.
  salesforce:
    image: node:22-alpine
    container_name: iq-bac-salesforce
    working_dir: /bac
    command: ["node", "serveur.mjs"]
    environment:
      PORT: "8099"
      SF_CLIENT_ID: clm-bac-a-sable
      SF_CLIENT_SECRET: bac-a-sable-seulement
    volumes:
      - ./salesforce:/bac:ro
    ports:
      - "8099:8099"

  # ICP : autorité OpenSSL réelle — horodatage RFC 3161 (/tsa), OCSP RFC 6960 (/ocsp), liste RFC 5280 (/crl/ac.crl),
  # certificat de l'AC (/ac.cer). Ses certificats publient ces points à http://localhost:18090, comme une autorité à
  # son adresse publique ; état (clés, registre) dans icp/etat, créé au premier démarrage.
  icp:
    image: clm-bac-a-sable:1
    build: ./outils
    container_name: iq-bac-icp
    command: ["sh", "/icp/lancer.sh"]
    volumes: ["./icp:/icp:ro", "./icp/etat:/etat"]
    ports: ["18090:18090", "18093:18093"]
    healthcheck: { test: ["CMD", "curl", "-sf", "http://localhost:18090/sante"], interval: 3s, retries: 40 }

  # pyHanko : validation PAdES (B-B à B-LTA) par POST /valider ; partage l'espace réseau de l'ICP pour en joindre les
  # points de publication à la même adresse que le serveur.
  pyhanko:
    image: clm-bac-a-sable:1
    container_name: iq-bac-pyhanko
    command: ["python3", "/validation/serveur.py"]
    network_mode: service:icp
    volumes: ["./validation:/validation:ro", "./icp/etat/ac:/etat/ac:ro"]
    depends_on: { icp: { condition: service_healthy } }

  # Conversion Word → PDF/A : Gotenberg 8 (LibreOffice), même image que le service « conversion » de production.
  conversion:
    image: gotenberg/gotenberg:8.17.3
    container_name: iq-bac-conversion
    # Délai de l'API aligné sur celui du serveur (CLM_CONVERSION_DELAI_SECONDES, 120 s) : à 30 s par défaut, Gotenberg
    # répond 503 à une conversion longue sous charge, alors que le serveur l'attendait encore.
    command: ["gotenberg", "--api-timeout=120s"]
    ports: ["18030:3000"]

  # veraPDF REST officiel : conformité PDF/A (POST /api/validate/2b).
  verapdf:
    image: verapdf/rest:latest
    container_name: iq-bac-verapdf
    ports: ["18092:8080"]

  # Courriel : Mailpit, vrai serveur SMTP (:11025) qui garde les messages et les expose par API (:18025, /api/v1).
  # Le serveur y envoie comme à un relais réel (NOTIFICATION_COURRIEL_MODE=smtp) ; liens d'invitation et codes y arrivent.
  courriel:
    image: axllent/mailpit:v1.21.8
    container_name: iq-bac-courriel
    ports: ["11025:1025", "18025:8025"]
