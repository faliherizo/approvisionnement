# Valeurs par défaut (surchargées par values-azure.yaml / values-aws.yaml).
image:
  registry: ""      # ex. <acr>.azurecr.io ou <account>.dkr.ecr.ca-central-1.amazonaws.com
  backend: vina-contrat/backend
  frontend: vina-contrat/frontend
  tag: latest
  pullPolicy: IfNotPresent

backend:
  replicas: 3
  port: 8085
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits: { cpu: "2", memory: "2Gi" }

# Conversion Word → PDF/A (Gotenberg) : même image que le bac à sable infra/bacs-a-sable.
conversion:
  replicas: 2
  image: gotenberg/gotenberg:8.17.3
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits: { cpu: "2", memory: "2Gi" }

frontend:
  replicas: 3
  port: 80

serviceAccount:
  name: backend
  annotations: {}   # IRSA (AWS) ou Workload Identity (Azure) — voir values-*.yaml

ingress:
  className: ""     # "webapprouting.kubernetes.azure.com" (AKS) ou "alb" (EKS)
  host: contrat.vinaitsolution.com
  annotations: {}
