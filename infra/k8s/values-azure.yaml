# Surcharges Azure (AKS). Le registre est injecté par le pipeline (--set image.registry).
image:
  tag: latest

serviceAccount:
  name: backend
  # Workload Identity : associe ce ServiceAccount à une identité managée (client-id).
  annotations:
    azure.workload.identity/client-id: "<CLIENT_ID_IDENTITE_MANAGEE>"

ingress:
  className: webapprouting.kubernetes.azure.com
  host: contrat.vinaitsolution.com
  annotations: {}
