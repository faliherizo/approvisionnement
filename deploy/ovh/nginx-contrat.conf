# Copie de référence du bloc « contrat » de ~/vina-cms/nginx/prod.conf (Nginx central vina_nginx, VPS OVH).
# Éditer prod.conf SANS changer son inode (nano, vi), jamais avec sed -i : le fichier est monté seul dans le conteneur.
# L'amont est une variable : contrat-frontend arrêté donne un 502 sur ce site au lieu d'empêcher Nginx de démarrer.
server {
    listen 443 ssl http2;
    server_name contrat.vinaitsolution.com;

    ssl_certificate     /etc/letsencrypt/live/vinaitsolution.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vinaitsolution.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 12m;
    set $contrat_amont http://contrat-frontend:8080;

    # Assistant IA (Ollama) : génération lente en CPU, délai étendu.
    location /api/ia/ {
        proxy_pass $contrat_amont;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass $contrat_amont;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
